<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Draft Results — Tournament Draft Room</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .results-page { padding: var(--s10) 0; position: relative; z-index: 1; }
    .podium { display: flex; align-items: flex-end; justify-content: center; gap: var(--s4); margin-bottom: var(--s10); }
    .podium-place { display: flex; flex-direction: column; align-items: center; gap: var(--s3); }
    .podium-block { border-radius: var(--r-md) var(--r-md) 0 0; width: 100px; display: flex; align-items: center; justify-content: center; font-family: 'Rajdhani',sans-serif; font-size: 1.5rem; font-weight: 700; }
    .podium-place.p1 .podium-block { height: 120px; background: linear-gradient(180deg, rgba(245,158,11,.4), rgba(245,158,11,.1)); border: 2px solid var(--gold); }
    .podium-place.p2 .podium-block { height: 80px;  background: linear-gradient(180deg, rgba(148,163,184,.25), rgba(148,163,184,.05)); border: 2px solid rgba(148,163,184,.4); }
    .podium-place.p3 .podium-block { height: 60px;  background: linear-gradient(180deg, rgba(245,158,11,.2), rgba(245,158,11,.05)); border: 2px solid rgba(245,158,11,.25); opacity:.8; }
    .result-captain-card { animation: fadeIn .4s var(--ease-out) both; }
    .player-result-item { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s3); border-radius: var(--r-sm); background: var(--bg-2); }
    .player-result-item .pri-num  { font-family:'Rajdhani',sans-serif; font-size:.85rem; color:var(--text-4); width:16px; flex-shrink:0; }
    .player-result-item .pri-name { flex:1; font-size:.85rem; font-weight:600; }
    .player-result-item .pri-pos  { font-size:.72rem; color:var(--primary-light); font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
    .player-result-item .pri-pts  { font-family:'Rajdhani',sans-serif; font-size:.9rem; font-weight:700; color:var(--gold-light); }
    .stat-box { background:var(--bg-2); border-radius:var(--r-md); padding:var(--s4); text-align:center; }
    .stat-box .stat-val { font-family:'Rajdhani',sans-serif; font-size:1.6rem; font-weight:700; }
    .stat-box .stat-lbl { font-size:.72rem; color:var(--text-3); text-transform:uppercase; letter-spacing:.08em; margin-top:2px; }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>
  <div class="bg-grid"></div>
  <div id="toast-container"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="logo"><div class="logo-mark">🏆</div><span id="nav-room-name">Draft Room</span></div>
      <div class="nav-info">
        <button class="btn btn-ghost btn-sm" id="btn-export">📥 Export Results</button>
        <a href="index.html" class="btn btn-primary btn-sm">+ New Room</a>
      </div>
    </div>
  </nav>

  <div class="results-page">
    <div class="container">
      <!-- Header -->
      <div class="results-header-card mb-8">
        <div style="font-size:3rem;margin-bottom:var(--s4);">🏁</div>
        <h1 class="gradient-text" style="font-size:2.5rem;margin-bottom:var(--s2);">Draft Complete!</h1>
        <p class="text-muted" id="results-subtitle">Final rosters are set. Here are the results.</p>
      </div>

      <!-- Podium (top 3 by points spent) -->
      <div id="podium-section" class="mb-10"></div>

      <!-- All results grid -->
      <h2 style="font-size:1.4rem;margin-bottom:var(--s6);">📋 All Rosters</h2>
      <div class="results-grid" id="results-grid">
        <div class="spinner" style="margin:40px auto;grid-column:1/-1;display:block;"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/results.js"></script>
</body>
</html>
